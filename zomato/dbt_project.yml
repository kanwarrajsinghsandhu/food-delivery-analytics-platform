name: zomato

profile: zomato

# TODO: Capture RESTAURANTS.rating changes over time
snapshot-paths: ["snapshots"]
model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

 

models:
  zomato:
    +static_analysis: strict
    staging:
      +materialized: view
      # Uses profile default schema: DEV
    marts:
      +materialized: table
      +schema: MARTS
    snapshot:
      +materialized: snapshot
      +schema: SNAPSHOTS
