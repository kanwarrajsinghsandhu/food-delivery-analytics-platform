version: 2

sources:
  - name: raw
    description: Raw Zomato data tables (bronze layer)
    database: ZOMATO
    # RAW_V2 (default) = calibrated synthetic orders from data_generator/, same dimensions (cloned).
    # RAW = original tutorial data, kept for comparison: dbt build --vars '{raw_schema: RAW}'
    schema: "{{ var('raw_schema', 'RAW_V2') }}"

    tables:
      - name: RESTAURANTS
        description: Raw restaurant dimension data (ID, name, city, rating, cost, cuisine, etc.)

      - name: USERS
        description: Raw user dimension data (ID, name, email, age, gender, income, education, etc.) — contains PII

      - name: FOOD
        description: Raw food items dimension (F_ID, item name, veg/non-veg)

      - name: MENU
        description: Raw menu items (R_ID, F_ID, cuisine, price)

      - name: ORDERS
        description: Raw orders fact table (order_id, user_id, restaurant_id, timestamp, amount, status, etc.)

      - name: ORDER_ITEMS
        description: Raw order line items (order_item_id, order_id, restaurant_id, food_id, price, quantity, line_amount)

      - name: REVIEWS
        description: Raw reviews (review_id, order_id, user_id, restaurant_id, rating, comment, review_date)
