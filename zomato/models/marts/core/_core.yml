version: 2

models:
  - name: fct_order_sales
    description: >
      Atomic Gold fact table — one row per order, carrying all commercial measures
      (INR + CAD) plus fulfillment and payment attributes. Foundation for all
      order-derived marts (executive summary, restaurant performance, retention).
      order_status has exactly 3 values in source data: Delivered, Cancelled, Refunded.
    columns:
      - name: order_id
        description: Unique order identifier (Primary Key)
        tests:
          - unique
          - not_null

      - name: customer_id
        description: >
          Foreign Key to dim_customer (sample data keyspace mismatch: dim_customer only has
          90,462 rows after stg_users' education filter, out of 100,000 raw users, while orders
          reference the full 100K user keyspace — same known pattern as stg_menu/stg_reviews FKs)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
              config:
                severity: warn

      - name: restaurant_id
        description: Foreign Key to stg_restaurants
        tests:
          - not_null

      - name: order_status
        description: Raw order outcome status
        tests:
          - accepted_values:
              arguments:
                values: ['Delivered', 'Cancelled', 'Refunded']

      - name: is_delivered
        description: True when order_status = 'Delivered'

      - name: is_cancelled
        description: True when order_status = 'Cancelled'

      - name: is_refunded
        description: True when order_status = 'Refunded'

      - name: is_discounted
        description: True when discount_inr > 0

      - name: sales_amount_inr
        description: Final order amount charged to customer, in INR (subtotal - discount + delivery_fee + gst)
        tests:
          - not_null

      - name: delivery_time_min
        description: Minutes from order placement to delivery. Null for non-delivered orders.

      - name: is_late_delivery_proxy
        description: >
          PROXY METRIC — no ETA/promised-delivery-time field exists in source data, so this
          flags delivery_time_min > 30 minutes as an absolute-threshold stand-in for the real
          dynamic-ETA SLA-breach definition Zomato actually uses. Null when order wasn't delivered.

  - name: fct_order_items
    description: >
      Atomic Gold fact table — one row per order line item. Foundation for menu/product-level
      marts (food performance, cuisine analysis). order_date and is_delivered are denormalized
      from the parent order for convenient time/status slicing without joining fct_order_sales.
    columns:
      - name: order_item_id
        description: Unique order line item identifier (Primary Key)
        tests:
          - unique
          - not_null

      - name: order_id
        description: Foreign Key to fct_order_sales
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_order_sales')
                field: order_id

      - name: restaurant_id
        description: Foreign Key to stg_restaurants
        tests:
          - not_null

      - name: food_id
        description: >
          Foreign Key to stg_food (sample data mismatch: line items reference food_ids beyond
          the small stg_food dimension sample — see stg_menu's same known issue, kept as warn)
        tests:
          - not_null

      - name: order_date
        description: Date the parent order was placed (denormalized from stg_orders)

      - name: is_delivered
        description: True when the parent order's status = 'Delivered' (denormalized from stg_orders)

      - name: quantity
        description: Units of this food item ordered in this line item

      - name: line_amount_inr
        description: Line-item total in INR (unit_price_inr × quantity, within documented tolerance — see line_items_arithmetic test)
        tests:
          - not_null

  - name: int_customer_order_sequence
    description: >
      Shared Gold backbone -- one row per delivered order per customer, ordered chronologically,
      carrying order-sequence (1st, 2nd, 3rd... order) and acquisition-cohort fields. Every
      customer-lifecycle mart (RFM, retention diagnostic, cohort retention, activation, discount
      dependency) builds from this model instead of independently re-deriving "first order" /
      "repeat order" / "cohort month". recency_anchor_date is the dataset's own max(order_date),
      not current_date() -- see mart_customer_rfm for why that matters.
    columns:
      - name: customer_id
        description: Foreign Key to dim_customer
        tests:
          - not_null

      - name: order_id
        description: Foreign Key to fct_order_sales (delivered orders only)
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_order_sales')
                field: order_id

      - name: order_sequence
        description: 1-indexed order number for this customer, ordered by order_date (1 = first order)
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true

      - name: acquisition_cohort_month
        description: Calendar month of this customer's first delivered order (date_trunc('month', first_order_date))
        tests:
          - not_null

      - name: acquisition_city
        description: >
          City of this customer's first delivered order, repeated on every row for the customer. The fixed
          city attribution used by city-filtered lifecycle marts (mart_customer_monthly_status,
          mart_growth_accounting_monthly) so customer counts stay additive across cities.
        tests:
          - not_null

      - name: city
        description: City of this specific order's restaurant (per-order, can differ from acquisition_city)

      - name: recency_anchor_date
        description: >
          max(order_date) across all delivered orders in the dataset -- a single dataset-wide value,
          repeated on every row. Used as the "as of" date for recency calculations instead of
          current_date(), so recency stays stable across reruns of this static/historical dataset.
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_id
              - order_sequence

  - name: dim_customer
    description: >
      Gold customer dimension — demographic attributes only, renamed key (customer_id) to match
      fct_order_sales/fct_order_items for joins. Order-derived metrics (recency/frequency/monetary,
      churn/retention segmentation) live in mart_customer_rfm, not here.
    tests:
      - no_pii_exposure
    columns:
      - name: customer_id
        description: Unique customer identifier (Primary Key)
        tests:
          - unique
          - not_null

      - name: age
        description: Customer age in years
        tests:
          - not_null

      - name: gender
        description: Gender (Male, Female, Other)
        tests:
          - not_null

      - name: education
        description: Education level (Graduate, Post Graduate, Undergraduate, High School)
        tests:
          - not_null

  - name: dim_date
    description: >
      Gold calendar dimension, one row per day from the first to the last order_date in fct_order_sales
      (no gaps). Exists so the BI layer (Power BI) has a proper marked date table for month/year slicers
      and MoM/YoY time intelligence, instead of deriving dates from fact rows.
    columns:
      - name: date_day
        description: Calendar date (Primary Key)
        tests:
          - unique
          - not_null

      - name: month_start
        description: First day of the calendar month -- joins to activity_month in the monthly lifecycle marts
        tests:
          - not_null

  - name: bridge_order_cuisine
    description: >
      Gold bridge table, one row per order per cuisine tag. fct_order_sales.cuisine is a comma-separated
      multi-tag string ("North Indian, Chinese"), so filtering on it directly either misses orders or
      double-counts them. This splits it once, the same way the Streamlit dashboard does at query time.
      An order with N tags appears N times here -- never sum order measures through this table without
      a distinct on order_id.
    columns:
      - name: order_id
        description: Foreign Key to fct_order_sales
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_order_sales')
                field: order_id

      - name: cuisine_tag
        description: A single trimmed cuisine tag
        tests:
          - not_null

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - cuisine_tag
